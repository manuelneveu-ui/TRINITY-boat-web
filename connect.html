<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TRINITY connect</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #020617;
      color: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .card {
      background: #0f172a;
      padding: 32px 28px;
      border-radius: 10px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
      max-width: 420px;
      width: 90%;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    p {
      margin: 0 0 24px;
      font-size: 14px;
      color: #cbd5f5;
    }

    .account-btn {
      width: 100%;
      margin-bottom: 10px;
      padding: 10px 14px;
      border-radius: 6px;
      border: 1px solid #1d4ed8;
      background: #1d4ed8;
      color: #f9fafb;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      text-decoration: none;
      box-sizing: border-box;
      transition: 0.2s ease;
    }

    .account-btn.secondary {
      background: transparent;
      border-color: #4b5563;
    }

    .account-btn:hover {
      filter: brightness(1.08);
    }

    .status-dot-ok {
      color: #22c55e;
    }

    .status-dot-bad {
      color: #ef4444;
    }

    .top-line {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      font-size: 13px;
      color: #9ca3af;
    }

    a.back-link {
      color: #9ca3af;
      text-decoration: none;
      font-size: 12px;
    }

    a.back-link:hover {
      text-decoration: underline;
    }

    .info {
      margin-top: 14px;
      font-size: 13px;
      color: #cbd5f5;
      min-height: 20px;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="top-line">
    <span>TRINITY connect</span>
    <a href="index.html" class="back-link">← Back to site</a>
  </div>

  <h1>Choose account</h1>
  <p>Select which Wi‑Fi account TRINITY should use.</p>

  <a href="http://10.109190.62/" target="_blank" rel="noopener noreferrer" class="account-btn">
    <span>
      <span id="wifi-dot-1" class="status-dot-bad">●</span>
      <span style="margin-left:6px;">MANUEL connect</span>
    </span>
    <span>Open</span>
  </a>

  <div id="info" class="info">Checking TRINITY link...</div>
</div>

<script>
  const TEST_URL = "http://10.95.204.62/";
  const dot = document.getElementById("wifi-dot-1");

  function setInfo(text) {
    const info = document.getElementById("info");
    if (info) info.textContent = text;
  }

  function setDot(ok) {
    if (!dot) return;
    dot.className = ok ? "status-dot-ok" : "status-dot-bad";
  }

  async function fetchStatus() {
    try {
      const response = await fetch(TEST_URL, {
        method: "GET",
        cache: "no-store"
      });

      if (response.ok) {
        setDot(true);
        setInfo("TRINITY link detected. Device is reachable.");
      } else {
        setDot(false);
        setInfo(`TRINITY responded with HTTP ${response.status}.`);
      }
    } catch (error) {
      setDot(false);
      setInfo("TRINITY link not reachable.");
      console.error("Fetch error:", error);
    }
  }

  fetchStatus();
  setInterval(fetchStatus, 3000);
</script>

</body>
</html>
